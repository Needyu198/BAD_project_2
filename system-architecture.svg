<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">PawEver System Architecture</title>
<desc id="desc">Pet owners, doctors and clinic staff use a React client application. It sends requests to a Node.js and Express API that reads and writes PostgreSQL. Appointment booking and queue check-in are separate records. Socket.IO sends queue change events to clients. The backend has a Docker deployment file.</desc>
